
name: Create golang vendor dist
on:
  push:
    tags:
      - '**'

jobs:
  golang-dist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create golang dist
        uses: projg2/golang-dist-action@v1
        with:
          dist-filename: zabbix-agent2-plugin-ember-plus-7.4.10
          exclude-directories: 
          vendor-dir: zabbix-agent2-plugin-ember-plus-7.4.10

